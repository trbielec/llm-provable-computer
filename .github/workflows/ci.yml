name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUN_HEAVY_TESTS: "false"

jobs:
  cargo-test:
    name: cargo test (${{ matrix.name }})
    if: env.RUN_HEAVY_TESTS == 'true' || matrix.heavy == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cargo_args: ""
            needs_python: false
            heavy: false
          - name: burn-model
            cargo_args: "--features burn-model"
            needs_python: false
            heavy: false
          - name: onnx-export
            cargo_args: "--features onnx-export"
            needs_python: true
            heavy: true
          - name: full
            cargo_args: "--features full"
            needs_python: true
            heavy: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        if: matrix.needs_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: matrix.needs_python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test ${{ matrix.cargo_args }}

  proof-regression:
    name: shared-transformer proof round-trips
    runs-on: ubuntu-latest
    # Only run on pushes to main; PRs rely on the fast default suite.
    if: env.RUN_HEAVY_TESTS == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run proof round-trip regression
        run: |
          set -o pipefail
          cargo test --release --test transformer_stark -- --include-ignored \
            staged_skeleton_proof_round_trips_for_average_hard_execution \
            forward_pass_proof_round_trips_for_average_hard_execution &
          PROOF_PID=$!
          while kill -0 "$PROOF_PID" 2>/dev/null; do
            sleep 30
            echo "shared transformer proof regression still running..."
          done
          wait "$PROOF_PID"

  milestone-1-proof:
    name: export and validate ONNX workflow
    if: env.RUN_HEAVY_TESTS == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Export ONNX from CLI
        run: cargo run --features onnx-export --bin tvm -- export-onnx programs/fibonacci.tvm -o compiled/fibonacci

      - name: Verify all engines from CLI
        run: cargo run --features full --bin tvm -- run programs/fibonacci.tvm --verify-all

      - name: Validate exported ONNX in Python
        run: python scripts/validate_onnx.py compiled/fibonacci --program-name fibonacci --expected-acc 21 --expected-halted true
